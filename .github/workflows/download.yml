name: download
run-name: job ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id:   { description: job id, required: true }
      url:      { description: YouTube URL, required: true }
      mode:     { description: video or audio, required: true, default: video }
      format:   { description: output container/codec, required: true, default: mp4 }
      quality:  { description: best or max height, required: true, default: best }
      playlist: { description: 'true = whole playlist', required: true, default: 'false' }
permissions:
  contents: write
jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      JOB_ID: ${{ inputs.job_id }}
      IN_URL: ${{ inputs.url }}
      IN_MODE: ${{ inputs.mode }}
      IN_FORMAT: ${{ inputs.format }}
      IN_QUALITY: ${{ inputs.quality }}
      IN_PLAYLIST: ${{ inputs.playlist }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
      IG_COOKIES: ${{ secrets.IG_COOKIES }}
      BILI_COOKIES: ${{ secrets.BILI_COOKIES }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch tools
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $d = Join-Path $env:RUNNER_TEMP 'tools'
          New-Item -ItemType Directory $d | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile "$d\yt-dlp.exe"
          Invoke-WebRequest https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile "$d\ff.zip"
          Expand-Archive "$d\ff.zip" "$d\ff"
          Copy-Item "$d\ff\*\bin\ffmpeg.exe", "$d\ff\*\bin\ffprobe.exe" $d
          $d | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$d\yt-dlp.exe" --version
          & "$d\ffmpeg.exe" -version | Select-Object -First 1
          node --version

      - name: Start PO token provider
        if: ${{ contains(inputs.url, 'youtu') }}   # YouTube only
        continue-on-error: true   # optional: if this fails, the download still runs without a PO token
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $repo = 'Brainicism/bgutil-ytdlp-pot-provider'
          $tag = gh api "repos/$repo/releases/latest" --jq .tag_name
          if (-not $tag) { throw 'Could not resolve the provider version' }
          Write-Host "bgutil provider $tag"
          # 1) yt-dlp plugin (zip dropped into the yt-dlp plugin folder)
          $plug = Join-Path $env:APPDATA 'yt-dlp\plugins'
          New-Item -ItemType Directory $plug -Force | Out-Null
          Invoke-WebRequest "https://github.com/$repo/releases/download/$tag/bgutil-ytdlp-pot-provider.zip" -OutFile "$plug\bgutil-ytdlp-pot-provider.zip"
          # 2) token server (same version as the plugin), listens on 127.0.0.1:4416
          git clone --depth 1 --single-branch --branch $tag "https://github.com/$repo.git" "$env:RUNNER_TEMP\bgutil"
          if ($LASTEXITCODE -ne 0) { throw 'git clone failed' }
          $srv = "$env:RUNNER_TEMP\bgutil\server"
          Push-Location $srv
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npx tsc
          if ($LASTEXITCODE -ne 0) { throw 'tsc failed' }
          Pop-Location
          $out = "$env:RUNNER_TEMP\pot.out.log"; $errlog = "$env:RUNNER_TEMP\pot.err.log"
          Start-Process node -ArgumentList 'build/main.js' -WorkingDirectory $srv -RedirectStandardOutput $out -RedirectStandardError $errlog
          $ok = $false
          foreach ($i in 1..30) {
            try { $c = [Net.Sockets.TcpClient]::new('127.0.0.1', 4416); $c.Close(); $ok = $true; break }
            catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ok) {
            Get-Content $out, $errlog -ErrorAction SilentlyContinue
            throw 'PO token server did not start'
          }
          Write-Host 'PO token server is up on 127.0.0.1:4416'

      - name: Download
        shell: pwsh
        run: |
          # Inputs arrive only through env vars and are validated here, never pasted into code.
          if ($env:IN_URL -notmatch '^https://(www\.|m\.|music\.)?(youtube\.com|youtu\.be|bilibili\.com|instagram\.com)/\S+$') { throw 'Invalid URL' }
          if ($env:IN_FORMAT -notmatch '^(mp4|mkv|webm|mp3|m4a|opus|flac|wav)$') { throw 'Invalid format' }
          if ($env:IN_QUALITY -notmatch '^(best|\d{3,4})$') { throw 'Invalid quality' }
          New-Item -ItemType Directory out | Out-Null

          $a = @('--no-warnings', '--newline', '--embed-metadata', '--restrict-filenames',
                 '--js-runtimes', 'node',
                 '--remote-components', 'ejs:github',
                 '-o', 'out/%(title).100B-%(id)s.%(ext)s')
          if ($env:IN_PLAYLIST -eq 'true') { $a += @('--yes-playlist', '--playlist-end', '100') } else { $a += '--no-playlist' }

          if ($env:IN_MODE -eq 'audio') {
            $a += @('-x', '--audio-format', $env:IN_FORMAT, '--audio-quality', '0')
          } else {
            $h = $env:IN_QUALITY
            $f = $(if ($h -eq 'best') { 'bv*+ba/b' } else { "bv*[height<=$h]+ba/b[height<=$h]" })
            $a += @('-f', $f, '--merge-output-format', $env:IN_FORMAT)
          }

          # Optional per-site cookies (Netscape format). yt-dlp only sends each cookie to its own domain.
          $ck = @($env:YT_COOKIES, $env:IG_COOKIES, $env:BILI_COOKIES) | Where-Object { $_ }
          if ($ck.Count -gt 0) {
            [IO.File]::WriteAllText("$PWD\cookies.txt", ($ck -join "`n"))
            $a += @('--cookies', 'cookies.txt')
          }

          yt-dlp @a $env:IN_URL
          $code = $LASTEXITCODE
          Remove-Item cookies.txt -ErrorAction SilentlyContinue
          if ($code -ne 0) {
            Write-Host '--- available formats (for debugging) ---'
            yt-dlp --js-runtimes node --remote-components ejs:github -F --no-playlist $env:IN_URL
            throw "yt-dlp exit $code"
          }

      - name: Package and publish
        shell: pwsh
        run: |
          $files = @(Get-ChildItem out -File -Recurse | Where-Object { $_.Extension -notin '.part', '.ytdl' })
          if ($files.Count -eq 0) { throw 'No output files' }
          # [ ] are glob characters for gh, so make sure no file name contains them
          $files = @($files | ForEach-Object {
            if ($_.Name -match '[\[\]]') {
              Rename-Item -LiteralPath $_.FullName -NewName ($_.Name -replace '[\[\]]', '') -PassThru
            } else { $_ }
          })
          if ($files.Count -eq 1) {
            $asset = $files[0].FullName
          } else {
            $asset = Join-Path $PWD "playlist-$env:JOB_ID.zip"
            Compress-Archive -LiteralPath ($files.FullName) -DestinationPath $asset -CompressionLevel NoCompression
          }
          if ((Get-Item $asset).Length -gt 1.9GB) { throw 'File exceeds the 2 GB release asset limit' }
          gh release create "job-$env:JOB_ID" $asset --repo $env:GH_REPO --target $env:GITHUB_SHA --title "job-$env:JOB_ID" --notes "Temporary. Auto-deleted after a few hours."

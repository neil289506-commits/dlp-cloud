name: download
run-name: job ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id: { description: job id, required: true }
      url: { description: Video URL, required: true }
      mode: { description: video or audio, required: true, default: video }
      format: { description: output container/codec, required: true, default: mp4 }
      quality: { description: best or max height, required: true, default: best }
      playlist: { description: 'true = whole playlist', required: true, default: 'false' }
permissions:
  contents: write
jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      JOB_ID: ${{ inputs.job_id }}
      IN_URL: ${{ inputs.url }}
      IN_MODE: ${{ inputs.mode }}
      IN_FORMAT: ${{ inputs.format }}
      IN_QUALITY: ${{ inputs.quality }}
      IN_PLAYLIST: ${{ inputs.playlist }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
      IG_COOKIES: ${{ secrets.IG_COOKIES }}
      BILI_COOKIES: ${{ secrets.BILI_COOKIES }}
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fetch tools
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $d = Join-Path $env:RUNNER_TEMP 'tools'
          New-Item -ItemType Directory $d -Force | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile "$d\yt-dlp.exe"
          Invoke-WebRequest https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile "$d\ff.zip"
          Expand-Archive "$d\ff.zip" "$d\ff"
          Copy-Item "$d\ff\*\bin\ffmpeg.exe", "$d\ff\*\bin\ffprobe.exe" $d
          $d | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$d\yt-dlp.exe" --version
      - name: Start PO token provider
        if: ${{ contains(inputs.url, 'youtu') }}
        continue-on-error: true
        shell: pwsh
        run: |
          $repo = 'Brainicism/bgutil-ytdlp-pot-provider'
          $tag = gh api "repos/$repo/releases/latest" --jq .tag_name
          $plug = Join-Path $env:APPDATA 'yt-dlp\plugins'
          New-Item -ItemType Directory $plug -Force | Out-Null
          Invoke-WebRequest "https://github.com/$repo/releases/download/$tag/bgutil-ytdlp-pot-provider.zip" -OutFile "$plug\bgutil-ytdlp-pot-provider.zip"
          git clone --depth 1 --branch $tag "https://github.com/$repo.git" "$env:RUNNER_TEMP\bgutil"
          Push-Location "$env:RUNNER_TEMP\bgutil\server"; npm ci; npx tsc
          Start-Process node -ArgumentList 'build/main.js' -WorkingDirectory (Get-Location)
          Pop-Location
      - name: Download
        shell: pwsh
        run: |
          if ($env:IN_URL -notmatch '^https://(www\.|m\.|music\.)?(youtube\.com|youtu\.be|bilibili\.com|instagram\.com)/\S+$') { throw 'Invalid URL' }
          if ($env:IN_FORMAT -notmatch '^(mp4|mkv|webm|mp3|m4a|opus|flac|wav)$') { throw 'Invalid format' }
          if ($env:IN_QUALITY -notmatch '^(best|\d{3,4})$') { throw 'Invalid quality' }
          New-Item -ItemType Directory out -Force | Out-Null
          $a = @('--no-warnings', '--newline', '--embed-metadata', '--restrict-filenames', '--js-runtimes', 'node', '--remote-components', 'ejs:github', '-o', 'out/%(title).100B-%(id)s.%(ext)s')
          $a += $(if ($env:IN_PLAYLIST -eq 'true') { @('--yes-playlist', '--playlist-end', '100') } else { @('--no-playlist') })
          if ($env:IN_MODE -eq 'audio') {
            $a += @('-x', '--audio-format', $env:IN_FORMAT, '--audio-quality', '0')
          } else {
            $f = if ($env:IN_QUALITY -eq 'best') { 'bv*+ba/b' } else { "bv*[height<=$env:IN_QUALITY]+ba/b[height<=$env:IN_QUALITY]" }
            $a += @('-f', $f, '--merge-output-format', $env:IN_FORMAT)
          }
          $cookie = if ($env:IN_URL -match 'instagram') { $env:IG_COOKIES } elseif ($env:IN_URL -match 'bilibili') { $env:BILI_COOKIES } else { $env:YT_COOKIES }
          if ($cookie) { [IO.File]::WriteAllText("$PWD\cookies.txt", $cookie); $a += @('--cookies', 'cookies.txt') }
          yt-dlp @a $env:IN_URL
          $code = $LASTEXITCODE
          Remove-Item cookies.txt -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "yt-dlp exit $code" }
      - name: Package and publish
        shell: pwsh
        run: |
          $files = @(Get-ChildItem out -File -Recurse | Where-Object { $_.Extension -notin '.part', '.ytdl' })
          if ($files.Count -eq 0) { throw 'No output files' }
          if ($files.Count -eq 1) { $asset = $files[0].FullName }
          else { $asset = Join-Path $PWD "playlist-$env:JOB_ID.zip"; Compress-Archive -LiteralPath ($files.FullName) -DestinationPath $asset -CompressionLevel NoCompression }
          if ((Get-Item $asset).Length -gt 1.9GB) { throw 'File exceeds the 2 GB release asset limit' }
          gh release create "job-$env:JOB_ID" $asset --repo $env:GH_REPO --target $env:GITHUB_SHA --title "job-$env:JOB_ID" --notes "Temporary. Auto-deleted after a few hours."
